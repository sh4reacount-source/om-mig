<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>consev</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #1a1a1a, #0a0a0a);
    color: white;
    overflow-x: hidden;
}

.topbar {
    position: absolute;
    top: 20px;
    right: 20px;
}

.lang-btn {
    background: #222;
    border: none;
    color: white;
    padding: 8px 12px;
    margin-left: 5px;
    border-radius: 6px;
    cursor: pointer;
}

.lang-btn:hover {
    background: #444;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 80px 20px;
    text-align: center;
}

h1 {
    font-size: 42px;
    margin-bottom: 10px;
    letter-spacing: 2px;
}

.desc {
    color: #aaa;
    line-height: 1.6;
}

.section {
    margin-top: 40px;
}

.song {
    background: #111;
    padding: 15px;
    margin: 10px 0;
    border-radius: 10px;
    transition: 0.2s;
    cursor: pointer;
    text-transform: lowercase;
}

.song:hover {
    transform: scale(1.03);
    background: #1c1c1c;
}

.links {
    margin-top: 30px;
}

.link-btn {
    display: block;
    text-decoration: none;
    color: white;
    padding: 14px;
    margin: 10px 0;
    border-radius: 10px;
    font-weight: bold;
    transition: 0.2s;
    text-transform: lowercase;
}

.spotify { background: #1db954; }
.soundcloud { background: #ff5500; }

.link-btn:hover {
    opacity: 0.85;
    transform: scale(1.05);
}

.glow {
    position: fixed;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, #1db95433, transparent);
    top: 20%;
    left: 10%;
    filter: blur(80px);
    animation: move 10s infinite alternate;
}

@keyframes move {
    from { transform: translate(0,0); }
    to { transform: translate(100px, 50px); }
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="topbar">
    <button class="lang-btn" onclick="setLang('en')">en</button>
    <button class="lang-btn" onclick="setLang('dk')">dk</button>
</div>

<div class="container">

<h1>consev</h1>

<p class="desc" id="desc">
i make music. mostly just testing sounds, building stuff, seeing what hits.
nothing too clean, just whatever feels right.
</p>

<div class="section">
    <h2 id="songsTitle">tracks</h2>

    <div class="song" onclick="openSpotify()">passede du til mig</div>
    <div class="song" onclick="openSpotify()">problem</div>
    <div class="song" onclick="openSpotify()">1mil scener</div>
    <div class="song" onclick="openSpotify()">smærtstilende (ft. bigmacnus)</div>
    <div class="song" onclick="openSpotify()">læber</div>
    <div class="song" onclick="openSpotify()">arcangel</div>
    <div class="song" onclick="openSpotify()">leo</div>
    <div class="song" onclick="openSpotify()">where are you.</div>
</div>

<div class="links">
    <a class="link-btn spotify" href="https://open.spotify.com/artist/6fcB7nbhKN38opldb3xq6K?si=q_AmiCcDRkyUKLvzu_pFxw" target="_blank">
        spotify
    </a>

    <a class="link-btn soundcloud" href="https://soundcloud.com/consev" target="_blank">
        soundcloud
    </a>
</div>

</div>

<script>
const content = {
    en: {
        desc: "i make music. mostly just testing sounds, building stuff, seeing what hits. nothing too clean, just whatever feels right.",
        songsTitle: "tracks"
    },
    dk: {
        desc: "jeg laver musik. mest bare tester lyde, bygger ting og ser hvad der virker. ikke noget fancy, bare hvad der føles rigtigt.",
        songsTitle: "tracks"
    }
};

function setLang(lang) {
    document.getElementById("desc").innerText = content[lang].desc;
    document.getElementById("songsTitle").innerText = content[lang].songsTitle;
}

function openSpotify() {
    window.open("https://open.spotify.com/artist/6fcB7nbhKN38opldb3xq6K?si=q_AmiCcDRkyUKLvzu_pFxw", "_blank");
}
</script>

</body>
</html>
